name: Build Swara APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 24.04 runners come with the Android SDK already installed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk Swara.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Swara-apk
          path: Swara.apk

      # Publishes the APK at a fixed link:
      # https://github.com/<owner>/<repo>/releases/latest/download/Swara.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Swara.apk \
            --title "Swara (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Swara.apk below and open it on your phone to install." \
            --latest
